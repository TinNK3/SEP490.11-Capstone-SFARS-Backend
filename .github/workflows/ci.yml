name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore SFARS.sln

      - name: Build
        run: dotnet build SFARS.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SFARS.sln --configuration Release --no-build --verbosity normal
