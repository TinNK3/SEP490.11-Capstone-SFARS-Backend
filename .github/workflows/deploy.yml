name: CI/CD Deploy .NET to VPS

on:
  push:
    branches: [ "main" ]

env:
  DOTNET_VERSION: "9.0.x"
  CONFIGURATION: "Release"
  APP_DIR: "/var/www/myapp"

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test -c ${{ env.CONFIGURATION }} --no-build

      # 👉 Publish ĐÚNG cho Linux + Clean Architecture
      - name: Publish
        run: dotnet publish ./SFARS.API/SFARS.API.csproj -c ${{ env.CONFIGURATION }} -o publish

      - name: Copy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "publish/**"
          target: ${{ env.APP_DIR }}
          strip_components: 1

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            whoami
            sudo -n /usr/bin/systemctl restart myapp
            sudo -n /usr/bin/systemctl status myapp --no-pager
